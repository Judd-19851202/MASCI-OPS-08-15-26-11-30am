name: Governance Regression Gate

on:
  pull_request:
    branches: [main]

jobs:
  governance-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install regression dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx pytest-asyncio

      - name: Governance convergence scanner
        run: |
          python3 backend/tools/wp15_governance_convergence_scan.py > /tmp/wp15-governance-scan.json
          python3 scripts/assert_wp15_governance_convergence.py /tmp/wp15-governance-scan.json

      - name: Governance certification suite
        run: |
          pytest \
            backend/tests/test_wp15_enterprise_governance.py \
            backend/tests/test_wp15_operational_health_engine.py \
            backend/tests/test_wp15_golden_path_registry.py \
            -q

      - name: Golden Path regression for monitored workflows
        run: |
          pytest backend/tests/test_wp15_golden_path_registry.py -q