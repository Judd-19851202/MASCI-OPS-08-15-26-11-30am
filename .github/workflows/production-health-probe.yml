name: production-health-probe

# TRACK 16.00 · GitHub Repository Lifecycle Hardening.
#
# Permanent fix for the snapshot-repo notification noise. Replaces all
# prior workflow shapes (15.34B job-level if, 15.56 noop sibling, 15.97
# consolidated dual-workflow).
#
# Mechanism
# ---------
# This workflow self-silences on every repository that is not the
# active production source. The check uses a GitHub Actions repository
# **variable** named ACTIVE_PRODUCTION_SOURCE:
#
#   * GitHub repository variables live at the repository-settings level,
#     NOT in the source tree. They are NOT copied when Emergent's
#     "Save to GitHub" snapshot mechanism clones a repo into a new
#     dated snapshot. (Repository secrets behave the same way.)
#   * Therefore: a freshly-created snapshot repo has NO variable set,
#     this workflow's "am I the active source?" gate evaluates false,
#     and only a single named status step runs. The cron + PR triggers
#     still resolve so branch-protection required checks resolve green,
#     but no probe HTTP calls fire and no failure email is generated.
#   * The active production repo is the ONE repo where an operator (or
#     the Emergent deploy pipeline) has explicitly set the variable to
#     match `${{ github.repository }}`. That repo — and only that repo —
#     runs the real probes.
#
# Bootstrap of the active variable on first deploy is documented in
#   /app/memory/TRACK_16_00_GITHUB_LIFECYCLE.md
# and a one-shot CLI is provided at
#   /app/scripts/github_lifecycle_manager.py
# to backfill snapshot repos that pre-date this change.
#
# Customer expectation: after the one-time backfill, ZERO manual
# cleanup is ever required again — every future snapshot is silent
# from the instant it is created.
#
# Triggers
# --------
#   * schedule           → real heartbeat every 15 min (active repo only)
#   * workflow_dispatch  → manual "Run workflow" button
#   * pull_request       → green check for branch-protection requirement
#                          (always runs the gate step; silent on snapshots)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: production-health-probe-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # NO job-level `if:`. Step-level gating only — the job ALWAYS has
    # at least one executable step, so the GitHub UI cannot render
    # "this check has no steps" under any trigger.

    env:
      PROD_URL: ${{ secrets.PROD_URL || 'https://mascidocs.com' }}
      ACTIVE_PRODUCTION_SOURCE: ${{ vars.ACTIVE_PRODUCTION_SOURCE }}

    steps:
      # =====================================================
      # STEP 1 — Lifecycle gate. ALWAYS runs. Single source of
      # truth for "is this repo the active production source?"
      # =====================================================
      - name: Resolve repository lifecycle role
        id: lifecycle
        run: |
          set -eu
          repo="${{ github.repository }}"
          active="${ACTIVE_PRODUCTION_SOURCE:-}"
          event="${{ github.event_name }}"
          echo "event:  $event"
          echo "repo:   $repo"
          if [ -z "$active" ]; then
            echo "is_active=false" >> "$GITHUB_OUTPUT"
            echo "role=snapshot_or_unconfigured" >> "$GITHUB_OUTPUT"
            echo "::notice::Repository variable ACTIVE_PRODUCTION_SOURCE is not set on this repo — classifying as snapshot / inactive. Probes will NOT run."
            {
              echo "## production-health-probe · silent (snapshot / inactive)"
              echo ""
              echo "- repo: \`$repo\`"
              echo "- event: \`$event\`"
              echo "- \`vars.ACTIVE_PRODUCTION_SOURCE\` is **unset** → this repo is operationally silent by design (Track 16.00)."
              echo ""
              echo "This is the **expected** state for every dated MASCI snapshot. No production probe runs here. No alert email will be generated."
              echo ""
              echo "If this repo IS supposed to be the active production source for mascidocs.com, set the repository variable in **Settings → Secrets and variables → Actions → Variables** to \`$repo\`."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$active" = "$repo" ]; then
            echo "is_active=true" >> "$GITHUB_OUTPUT"
            echo "role=active_production" >> "$GITHUB_OUTPUT"
            echo "This repository IS the active production source. Probes will run."
            {
              echo "## production-health-probe · active production source"
              echo ""
              echo "- repo: \`$repo\`"
              echo "- event: \`$event\`"
              echo "- target: \`$PROD_URL\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "is_active=false" >> "$GITHUB_OUTPUT"
            echo "role=snapshot_explicit" >> "$GITHUB_OUTPUT"
            echo "::notice::This repo is not the active production source (active = $active). Probes will NOT run."
            {
              echo "## production-health-probe · silent (non-active snapshot)"
              echo ""
              echo "- repo: \`$repo\`"
              echo "- active production source per \`vars.ACTIVE_PRODUCTION_SOURCE\`: \`$active\`"
              echo "- This repo is intentionally silent."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # =====================================================
      # The remaining steps run ONLY when the lifecycle gate
      # classifies this repo as the active production source.
      # =====================================================

      - name: GET /api/health
        if: steps.lifecycle.outputs.is_active == 'true'
        id: probe_health
        run: |
          set -eu
          echo "→ GET ${PROD_URL}/api/health"
          tmp=$(mktemp)
          hdr=$(mktemp)
          status=$(curl -sS --max-time 15 -D "$hdr" -o "$tmp" -w "%{http_code}|dns=%{time_namelookup}|connect=%{time_connect}|tls=%{time_appconnect}|total=%{time_total}|remote_ip=%{remote_ip}" "${PROD_URL}/api/health" || echo "000")
          body=$(cat "$tmp")
          echo "  HTTP ${status}"
          echo "  headers:"
          grep -Ei '^(server:|via:|cf-ray:|content-type:|content-length:)' "$hdr" || true
          echo "  body: ${body}"
          code=$(printf '%s' "$status" | cut -d'|' -f1)
          if [ "${code}" != "200" ]; then
            echo "::error::/api/health returned HTTP ${status} (expected 200)"
            exit 1
          fi
          python3 - "$tmp" <<'PY'
          import json, sys
          j = json.load(open(sys.argv[1]))
          assert j.get("ok") is True, f"/api/health missing ok=true: {j!r}"
          print("✓ /api/health ok=true · service=" + str(j.get("service")))
          PY

      - name: GET /api/version
        if: steps.lifecycle.outputs.is_active == 'true'
        id: probe_version
        run: |
          set -eu
          echo "→ GET ${PROD_URL}/api/version"
          tmp=$(mktemp)
          hdr=$(mktemp)
          status=$(curl -sS --max-time 15 -D "$hdr" -o "$tmp" -w "%{http_code}|dns=%{time_namelookup}|connect=%{time_connect}|tls=%{time_appconnect}|total=%{time_total}|remote_ip=%{remote_ip}" "${PROD_URL}/api/version" || echo "000")
          echo "  HTTP ${status}"
          echo "  headers:"
          grep -Ei '^(server:|via:|cf-ray:|content-type:|content-length:)' "$hdr" || true
          code=$(printf '%s' "$status" | cut -d'|' -f1)
          if [ "${code}" != "200" ]; then
            echo "::error::/api/version returned HTTP ${status} (expected 200)"
            cat "$tmp"
            exit 1
          fi

      - name: GET /api/ready
        if: steps.lifecycle.outputs.is_active == 'true'
        id: probe_ready
        run: |
          set -eu
          echo "→ GET ${PROD_URL}/api/ready"
          tmp=$(mktemp)
          hdr=$(mktemp)
          status=$(curl -sS --max-time 15 -D "$hdr" -o "$tmp" -w "%{http_code}|dns=%{time_namelookup}|connect=%{time_connect}|tls=%{time_appconnect}|total=%{time_total}|remote_ip=%{remote_ip}" "${PROD_URL}/api/ready" || echo "000")
          echo "  HTTP ${status}"
          echo "  headers:"
          grep -Ei '^(server:|via:|cf-ray:|content-type:|content-length:)' "$hdr" || true
          code=$(printf '%s' "$status" | cut -d'|' -f1)
          if [ "${code}" != "200" ]; then
            echo "::error::/api/ready returned HTTP ${status} (expected 200)"
            cat "$tmp"
            exit 1
          fi
          python3 - "$tmp" <<'PY'
          import json, sys
          j = json.load(open(sys.argv[1]))
          assert j.get("app_env") == "production", f"app_env={j.get('app_env')!r}"
          assert j.get("db_name") == "masci_safety", f"db_name={j.get('db_name')!r}"
          assert j.get("release"), "release/source_hash is empty"
          print(f"✓ /api/version OK · release={j.get('release')[:12]}… · uptime_s={j.get('uptime_s')}")
          PY

      # Authenticated readiness check — only runs on schedule/manual,
      # AND only when this is the active repo, AND only when secrets
      # are configured. Never on pull_request. Never on snapshots.
      - name: Detect admin credentials availability
        if: steps.lifecycle.outputs.is_active == 'true' && github.event_name != 'pull_request'
        id: creds
        env:
          _EMAIL: ${{ secrets.OPS_ADMIN_EMAIL }}
          _PASS:  ${{ secrets.OPS_ADMIN_PASSWORD }}
        run: |
          if [ -n "${_EMAIL:-}" ] && [ -n "${_PASS:-}" ]; then
            echo "have=true"  >> "$GITHUB_OUTPUT"
            echo "Admin credentials present — authenticated readiness probe will run."
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPS_ADMIN_EMAIL / OPS_ADMIN_PASSWORD secrets not configured — skipping authenticated readiness probe."
          fi

      - name: GET /api/admin/deployment-readiness
        if: steps.lifecycle.outputs.is_active == 'true' && github.event_name != 'pull_request' && steps.creds.outputs.have == 'true'
        env:
          OPS_ADMIN_EMAIL:    ${{ secrets.OPS_ADMIN_EMAIL }}
          OPS_ADMIN_PASSWORD: ${{ secrets.OPS_ADMIN_PASSWORD }}
        run: |
          set -eu
          echo "→ POST ${PROD_URL}/api/auth/multi-login"
          login_tmp=$(mktemp)
          status=$(curl -sS --max-time 20 -o "$login_tmp" -w "%{http_code}" \
            -X POST "${PROD_URL}/api/auth/multi-login" \
            -H "Content-Type: application/json" \
            --data-binary @<(python3 -c 'import os,json;print(json.dumps({"email":os.environ["OPS_ADMIN_EMAIL"],"password":os.environ["OPS_ADMIN_PASSWORD"]}))') \
            || echo "000")
          echo "  HTTP ${status}"
          if [ "${status}" != "200" ]; then
            echo "::error::multi-login returned HTTP ${status}"
            head -c 400 "$login_tmp"
            exit 1
          fi
          admin_tok=$(python3 -c 'import json,sys;print((json.load(open(sys.argv[1])).get("portal_tokens") or {}).get("admin",""))' "$login_tmp")
          dir_tok=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("session_token", ""))' "$login_tmp")
          if [ -z "$admin_tok" ]; then
            echo "::error::multi-login response did not include an admin portal token"
            exit 1
          fi
          if [ -z "$dir_tok" ]; then
            echo "::error::multi-login response did not include a directory session token"
            exit 1
          fi
          echo "  admin token length: ${#admin_tok}"
          rdy_tmp=$(mktemp)
          rstatus=$(curl -sS --max-time 20 -o "$rdy_tmp" -w "%{http_code}" \
            -H "X-Admin-Token: ${admin_tok}" \
            -H "X-Directory-Token: ${dir_tok}" \
            "${PROD_URL}/api/admin/deployment-readiness" || echo "000")
          echo "  /api/admin/deployment-readiness HTTP ${rstatus}"
          if [ "${rstatus}" != "200" ]; then
            echo "::error::readiness gate returned HTTP ${rstatus}"
            head -c 400 "$rdy_tmp"
            exit 1
          fi
          python3 - "$rdy_tmp" <<'PY'
          import json, sys
          j = json.load(open(sys.argv[1]))
          decision = j.get("decision")
          blocking = j.get("blocking_gates") or []
          bootstrap = j.get("bootstrap") or {}
          print(f"  decision={decision} · trust_score={j.get('trust_score')} · band={j.get('trust_band')}")
          if decision != "pass":
              for g in blocking[:5]:
                  print(f"   BLOCK: {g.get('id')} · {g.get('summary')}")
              raise SystemExit("readiness gate decision != pass")
          if blocking:
              raise SystemExit(f"readiness gate has {len(blocking)} blocking gate(s)")
          if bootstrap and bootstrap.get("ran") is False:
              raise SystemExit("Track 15.93 bootstrap never ran in production")
          if bootstrap and bootstrap.get("ok") is False:
              raise SystemExit("Track 15.93 bootstrap reported ok=false")
          print("✓ readiness gate PASS")
          PY
